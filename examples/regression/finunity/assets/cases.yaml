# FinUnityServer 用例目录（示例）
#
# 每一行是一个"可追踪映射"：编号 -> 真实 pytest 入口。runner 只执行这里登记的 entry。
# status 说明：
#   active     可被自动执行，也可能被建议回归
#   draft      草稿，不执行
#   deprecated 已下线，不执行
#   ui/manual/perf  只能人工或 UI 执行，列入建议但不算自动化覆盖
#
# 维护要求：entry 指向的函数必须真实存在；重命名测试函数时同步改这里。

cases:
  - id: TC-HEALTH-001
    name: 健康检查就绪接口返回 200
    module: 接口与健康检查
    entry: [tests/test_health.py::test_live_is_a_constant_pulse]
    status: active
    api: [/health/live]
    notes: 冒烟核心路径
    last_verified: "2026-10-22"

  - id: TC-HEALTH-002
    name: 就绪接口在数据库不可用时返回 503
    module: 接口与健康检查
